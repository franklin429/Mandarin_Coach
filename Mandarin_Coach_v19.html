            // Tag language extraction helper
            const getTagDisplay = (tag, lang) => {
                if (!tag) return '';
                if (lang === 'zh') {
                    const m = tag.match(/[（(]([^）)]*[一-鿿＀-￯][^）)]*)[）)]/);
                    if (m) return m[1];
                    const ch = tag.match(/[一-鿿][一-鿿+\-\/\s]*/g);
                    if (ch && ch.length) return ch.join(' ');
                }
                // English: strip Chinese parenthetical content
                return tag
                    .replace(/[（(][^）)]*[一-鿿][^）)]*[）)]/g, '')
                    .replace(/[一-鿿]+/g, '')
                    .replace(/\s{2,}/g, ' ').replace(/[-—]\s*$|^\s*[-—]/g, '').trim() || tag;
            };

            // ── Pitch detection (autocorrelation) ──
            const detectPitchHz = (analyser, sampleRate) => {
                const fftSize = analyser.fftSize;
                const buf = new Float32Array(fftSize);
                analyser.getFloatTimeDomainData(buf);
                let rms = 0;
                for (let i = 0; i < fftSize; i++) rms += buf[i]*buf[i];
                rms = Math.sqrt(rms / fftSize);
                if (rms < 0.008) return -1;
                const minT = Math.round(sampleRate / 420);
                const maxT = Math.round(sampleRate / 65);
                let bestT = minT, bestC = -1;
                for (let t = minT; t <= Math.min(maxT, fftSize - 1); t++) {
                    let c = 0;
                    const len = fftSize - t;
                    for (let i = 0; i < len; i++) c += buf[i] * buf[i + t];
                    c /= len;
                    if (c > bestC) { bestC = c; bestT = t; }
                }
                if (bestC < 0.005) return -1;
                return sampleRate / bestT;
            };

            const hzToNoteName = (hz) => {
                if (hz <= 0) return '';
                const notes = ['A','A#','B','C','C#','D','D#','E','F','F#','G','G#'];
                const n = Math.round(12 * Math.log2(hz / 440)) + 57;
                if (n < 0) return '';
                const oct = Math.floor(n / 12);
                return notes[n % 12] + oct;
            };

            // Reference pitch from tone marks
            const genRefPitch = (bopomofo, nPts = 40) => {
                const syls = (bopomofo || '').trim().split(/\s+/);
                const pts = [];
                syls.forEach((s, si) => {
                    const base = si / syls.length, span = 1 / syls.length;
                    const n = Math.max(5, Math.round(nPts / syls.length));
                    let tone = 1;
                    if (s.includes('ˋ')) tone = 4;
                    else if (s.includes('ˊ')) tone = 2;
                    else if (s.includes('ˇ')) tone = 3;
                    else if (s.includes('˙')) tone = 0;
                    for (let i = 0; i < n; i++) {
                        const p = i / (n - 1);
                        let hz;
                        if (tone === 1) hz = 195;
                        else if (tone === 2) hz = 130 + 80 * p;
                        else if (tone === 3) hz = p < 0.5 ? 160 - 60*(p*2) : 100 + 80*((p-0.5)*2);
                        else if (tone === 4) hz = 220 - 135 * p;
                        else hz = 125 + 15 * p; // neutral
                        pts.push({ t: base + span * p, hz });
                    }
                });
                return pts;
            };

            // Draw chromatic pitch canvas
            const drawPitchCanvas = React.useCallback((canvas, userPts, refPts) => {
                if (!canvas) return;
                const W = canvas.width, H = canvas.height;
                const ctx = canvas.getContext('2d');
                ctx.clearRect(0, 0, W, H);
                ctx.fillStyle = '#111827'; ctx.fillRect(0, 0, W, H);
                const LW = 34; // label width
                const minHz = 65, maxHz = 310;
                const hzToY = hz => H - (Math.log2(hz/minHz) / Math.log2(maxHz/minHz)) * H;
                const GRID = [
                    {n:'A1',hz:55},{n:'B1',hz:61.7},{n:'C2',hz:65.4},{n:'D2',hz:73.4},
                    {n:'E2',hz:82.4},{n:'G2',hz:98},{n:'A2',hz:110},{n:'B2',hz:123.5},
                    {n:'C3',hz:130.8},{n:'D3',hz:146.8},{n:'E3',hz:164.8},{n:'G3',hz:196},
                    {n:'A3',hz:220},{n:'B3',hz:246.9},{n:'C4',hz:261.6},{n:'D4',hz:293.7},
                ];
                GRID.forEach(({n, hz}) => {
                    const y = hzToY(hz);
                    if (y < 0 || y > H) return;
                    const isC = n.startsWith('C');
                    ctx.strokeStyle = isC ? 'rgba(255,255,255,0.18)' : 'rgba(255,255,255,0.06)';
                    ctx.lineWidth = isC ? 1.2 : 0.6;
                    ctx.beginPath(); ctx.moveTo(LW, y); ctx.lineTo(W, y); ctx.stroke();
                    if (isC || n.startsWith('G') || n.startsWith('A') || n.startsWith('D')) {
                        ctx.fillStyle = isC ? 'rgba(200,210,255,0.9)' : 'rgba(150,160,180,0.7)';
                        ctx.font = `${isC ? 'bold ' : ''}9px monospace`;
                        ctx.textAlign = 'right'; ctx.fillText(n, LW - 2, y + 3);
                    }
                });
                const PW = W - LW;
                // Reference line (dashed teal)
                if (refPts.length > 1) {
                    ctx.save(); ctx.setLineDash([5, 3]);
                    ctx.strokeStyle = 'rgba(52,211,153,0.85)'; ctx.lineWidth = 2;
                    ctx.beginPath();
                    refPts.forEach((pt, i) => {
                        const x = LW + pt.t * PW, y = hzToY(pt.hz);
                        i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
                    });
                    ctx.stroke(); ctx.restore();
                }
                // User orange bars + white line
                const validPts = userPts.filter(p => p.hz > 0);
                if (validPts.length > 0) {
                    const t0 = validPts[0].t, tN = validPts[validPts.length-1].t;
                    const span = tN - t0 || 1;
                    validPts.forEach(pt => {
                        const x = LW + ((pt.t - t0) / span) * PW;
                        const y = hzToY(pt.hz);
                        ctx.fillStyle = '#f59e0b';
                        ctx.fillRect(x - 2, y - 7, 4, 14);
                    });
                    ctx.beginPath(); ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 1.8;
                    let started = false;
                    validPts.forEach(pt => {
                        const x = LW + ((pt.t - t0) / span) * PW;
                        const y = hzToY(pt.hz);
                        if (!started) { ctx.moveTo(x, y); started = true; } else ctx.lineTo(x, y);
                    });
                    ctx.stroke();
                }
                // Legend
                ctx.font = 'bold 9px sans-serif'; ctx.textAlign = 'left';
                ctx.fillStyle = 'rgba(52,211,153,0.9)'; ctx.fillText('▸ Ref', LW + 4, 12);
                ctx.fillStyle = '#f59e0b'; ctx.fillText('▌ You', LW + 48, 12);
            }, []);

            const [showFavTable, setShowFavTable] = React.useState(false);

            // Bilingual tongueHint translator (bopomofo always preserved)
            const toZH = (s) => {
                if (!s) return s;
                let t = s;
                // ── Full sentence / compound phrases (most specific first) ──
                t = t.replace(/Dynamic GIF:\s*/gi, '動態圖說明：');
                t = t.replace(/Notice the rapid\b/gi, '注意快速的');
                t = t.replace(/It starts at the\b/gi, '動作從');

                    } else if (targetWord === '不是' && (cleanSpoke.includes('不') || cleanSpoke.includes('是') || cleanSpoke.includes('不是'))) {
                        feedback += "Tone sandhi! 不 (normally 4th) shifts to 2nd tone before another 4th syllable. So: 不 sounds like bú (rising) → 是 (shì, falling). ㄅ: quiet bilabial. ㄨ: round. ㄕ: retroflex sibilant vowel. Feel the rising 不 setting up the decisive falling 是.";
                    } else if (targetWord === '地鐵' && (cleanSpoke.includes('地') || cleanSpoke.includes('鐵') || cleanSpoke.includes('地鐵'))) {
                        feedback += "Excellent aspiration contrast drill! ㄉ (dì): quiet unaspirated alveolar; ㄊ (tiě): clear aspiration burst. Both go to high-front ㄧ after the initial. 4th tone (fall) → 3rd tone (dip-rise). Feel the quiet-then-breathy aspiration pattern in this subway word.";
                    } else if (targetWord === '公車' && (cleanSpoke.includes('公') || cleanSpoke.includes('車') || cleanSpoke.includes('公車'))) {
                        feedback += "Two stops at opposite ends of the mouth! ㄍ is back-unaspirated (soft palate); ㄔ is retroflex-aspirated (hard palate, curled tip). Both 1st tone: hold the high flat pitch through ㄥ (back nasal coda) and through ㄜ (mid-central vowel). Both nasal endings and vowels must sustain the 1st tone clearly.";
                    } else if (targetWord === '飛機' && (cleanSpoke.includes('飛') || cleanSpoke.includes('機') || cleanSpoke.includes('飛機'))) {
                        feedback += "Both syllables stay in the FRONT of the mouth: ㄈ (labiodental friction at lips/teeth) → ㄟ (tongue rises forward) → ㄐ (palatal arch, body forward) → ㄧ (high-front). Both 1st tone: hold the high level pitch throughout. Practice feeling how both syllables never go to the back of the mouth.";
                    } else if (targetWord === '是' && (cleanSpoke.includes('是') || cleanSpoke.includes('事') || cleanSpoke.includes('試') || cleanSpoke.includes('示'))) {
                        feedback += "ㄕˋ is the retroflex sibilant vowel with 4th tone. Curl the tip UP-BACK toward the hard palate, then keep it curled through the vowel. 4th tone: sharp, decisive fall from the top. Compare 是 (shì, curl BACK) vs 四 (sì, tip FLAT-FRONT): same final vowel type, completely opposite tongue direction!";
                    } else if (targetWord === '好' && (cleanSpoke.includes('好') || cleanSpoke.includes('號') || cleanSpoke.includes('毫') || cleanSpoke.includes('豪'))) {
                        feedback += "ㄏ: back friction (like fogging a mirror). ㄠ: wide open to [a], glide toward [o]. 3rd tone: dip very low before rising. Minimal pair: 好 (hǎo, 3rd) vs 號 (hào, 4th) — same phonemes, only the tonal shape differs. Master this word's 3rd-tone dip; it appears in countless phrases!";
                    } else if (targetWord === '男' && (cleanSpoke.includes('男') || cleanSpoke.includes('難') || cleanSpoke.includes('楠') || cleanSpoke.includes('南'))) {
                        feedback += "ㄋ: tip at alveolar ridge, nasal hum. ㄢ: drop open to [a], then tip RETURNS to the same ridge for final [n]. A round trip for the tip! Make the final [n] closure clear. 2nd tone: rise steadily from mid to top.";
                    } else if (targetWord === '歌' && (cleanSpoke.includes('歌') || cleanSpoke.includes('割') || cleanSpoke.includes('閣') || cleanSpoke.includes('個'))) {

                    } else if (targetWord === '音樂' && (cleanSpoke.includes('音') || cleanSpoke.includes('樂') || cleanSpoke.includes('音樂'))) {

                    } else if (targetWord === '電話' && (cleanSpoke.includes('電') || cleanSpoke.includes('話') || cleanSpoke.includes('電話'))) {
                        feedback += "Two 4th tones. ㄉ: quiet front stop; ㄢ closes with front [n]. ㄏ: back friction; ㄨ: round; ㄚ: wide open. The initials move from front (ㄉ) to back (ㄏ) — the full mouth traversal between syllables. Both tones must fall sharply from the top.";

                        feedback += "Count your alveolar ridge contacts! ㄉ (stop at ridge) → ㄢ (closes with [n] at ridge) → ㄋ (nasal hum at ridge) — three alveolar touches before the tongue finally drops for ㄠ. 4th tone (fall) → 3rd tone (dip-rise). A great alveolar precision drill!";
                    } else if (targetWord === '餐廳' && (cleanSpoke.includes('餐') || cleanSpoke.includes('廳') || cleanSpoke.includes('餐廳'))) {
                        feedback += "Two aspirated initials from different places: ㄘ (flat-front puff) and ㄊ (alveolar ridge puff). Feel the origin shift. Both nasal codas also contrast: ㄢ = front [n]; ㄥ = back [ŋ]. Both 1st tone: hold steady flat high throughout.";
                    } else if (targetWord === '銀行' && (cleanSpoke.includes('銀') || cleanSpoke.includes('行') || cleanSpoke.includes('銀行'))) {

                        feedback += "ㄧ: clean high-front start. Then ㄕ: curl the tip completely backward — a full reversal of tongue direction. ㄥ: root rises for back nasal [ŋ]. The retroflex must be clear; don't let the fronted ㄧ prevent the tip from curling. Both 1st tone: hold flat high.";
                    } else if (targetWord === '學生' && (cleanSpoke.includes('學') || cleanSpoke.includes('生') || cleanSpoke.includes('學生'))) {
                        feedback += "ㄒㄩ: front-palatal friction + lips round. Then ㄕ: un-round the lips completely AND curl the tip backward. Lip shape AND tongue position both reverse at the boundary. 2nd tone (rise on 學) → 1st tone (flat on 生). Make the lip un-rounding decisive!";
                    } else if (targetWord === '超市' && (cleanSpoke.includes('超') || cleanSpoke.includes('市') || cleanSpoke.includes('超市'))) {
                        feedback += "Double retroflex! ㄔ: curl back + strong aspiration burst. ㄠ: drop wide open. ㄕ: curl back again, this time as a continuous fricative (no burst). The difference: ㄔ pops open (stop), ㄕ hisses (fricative). 1st tone (flat high) → 4th tone (sharp fall).";
                    } else if (targetWord === '兒子' && (cleanSpoke.includes('兒') || cleanSpoke.includes('子') || cleanSpoke.includes('兒子'))) {
                        feedback += "ㄦ: no initial — just curl the tip backward into the r-colored vowel (starts from neutral [ə]). 2nd tone: rise through the curl. Then ˙ㄗ: shift tip to FLAT-FRONT — the opposite direction. Retroflex-to-flat is the core contrast. Make ˙ㄗ very light and brief.";
                    } else if (targetWord === '女兒' && (cleanSpoke.includes('女') || cleanSpoke.includes('兒') || cleanSpoke.includes('女兒'))) {
                        feedback += "Three configurations: ㄋ (nasal hum at ridge) → ㄩ (body high-forward + lips round, 3rd dip) → ㄦ (tip curls backward, 2nd rise). The rounded lips of ㄩ must fully un-round before the tip curls for ㄦ. Say 女 (ㄩ alone) then 兒 (ㄦ alone) separately first, then link them!";
                    } else if (targetWord === '研究' && (cleanSpoke.includes('研') || cleanSpoke.includes('究') || cleanSpoke.includes('研究'))) {
                        feedback += "ㄢ in 研 must fully close with alveolar [n] — tip rises to the ridge. Then ㄐ in 究 shifts to front-palatal; ㄡ glides backward with progressive lip rounding. 2nd tone (rise on 研) → 3rd tone (dip on 究). The research tone pattern: first ask (rise), then investigate (dip)!";
                    } else if (targetWord === '分析' && (cleanSpoke.includes('分') || cleanSpoke.includes('析') || cleanSpoke.includes('分析'))) {
                        feedback += "Two different initials, same 1st-tone level pitch throughout. ㄈ: labiodental friction (teeth on lip). ㄣ: close with front nasal [n]. Then ㄒ: front-palatal friction. ㄧ: high-front. Both 1st tone: sustain the high level pitch from labiodental all the way through to the palatal high-front — analytical steadiness!";
                    } else if (targetWord === '理論' && (cleanSpoke.includes('理') || cleanSpoke.includes('論') || cleanSpoke.includes('理論'))) {
                        feedback += "Same initial ㄌ twice — only the vowels differ! 理 (ㄌㄧ): lateral tap → high-front, 3rd tone dips. 論 (ㄌㄨㄣ): lateral tap → lips round → close with [n], 4th falls. Feel how the same lateral tap leads to completely different mouth shapes. The theory is in the contrast!";
                    } else if (targetWord === '概念' && (cleanSpoke.includes('概') || cleanSpoke.includes('念') || cleanSpoke.includes('概念'))) {
                        feedback += "Both 4th tones — two decisive falls. 概 (ㄍㄞ): back velar → diphthong gliding forward. 念 (ㄋㄧㄢ): front nasal → high-front → close with [n]. Make sure ㄢ in 念 fully closes with alveolar [n]. The concept arrives with two authoritative falls!";
                    } else if (targetWord === '方法' && (cleanSpoke.includes('方') || cleanSpoke.includes('法') || cleanSpoke.includes('方法'))) {
                        feedback += "Same ㄈ initial twice! The key difference is the final: 方 (ㄈㄤ) closes with back nasal [ŋ] — feel the buzz at the back of your nasal cavity. 法 (ㄈㄚ) is a pure open vowel — no nasal closure at all. Listen for the nasal-vs-open contrast. 1st tone (flat) → 3rd tone (dip).";
                    } else if (targetWord === '結果' && (cleanSpoke.includes('結') || cleanSpoke.includes('果') || cleanSpoke.includes('結果'))) {

                    } else if (targetWord === '影響' && (cleanSpoke.includes('影') || cleanSpoke.includes('響') || cleanSpoke.includes('影響'))) {

                    } else if (targetWord === '觀點' && (cleanSpoke.includes('觀') || cleanSpoke.includes('點') || cleanSpoke.includes('觀點'))) {

                    } else if (targetWord === '證明' && (cleanSpoke.includes('證') || cleanSpoke.includes('明') || cleanSpoke.includes('證明'))) {

                setAiFeedback(`[Local Diagnostics] ${feedback}`);
                setRecordingState('completed');
                setShowResult(true);
                setShowFeedbackModal(true);
                setTimeout(() => { if(pitchCanvasRef.current && pitchDataRef.current.length > 0) drawPitchCanvas(pitchCanvasRef.current, pitchDataRef.current, refPoints); }, 200);

            const playStandardAudio = () => {
                if ('speechSynthesis' in window) {
                    window.speechSynthesis.cancel();
                    setIsPlayingStandard(true);
                    const utterance = new SpeechSynthesisUtterance(currentData.word);
                    utterance.lang = 'zh-TW';
                    utterance.rate = 0.75;
                    utterance.onend = () => setIsPlayingStandard(false);
                    utterance.onerror = () => setIsPlayingStandard(false);
                    window.speechSynthesis.speak(utterance);
                }
            };

            const resetPractice = () => {
                isHoldingRef.current = false;
                shouldStopRef.current = true;
                clearInterval(pitchIntervalRef.current);
                setShowFeedbackModal(false);
                setShowFavTable(false);

                setShowResult(false);
                setTranscript('');
                setAiFeedback('');
                setPitchPoints([]);
                setRefPoints([]);

            };

            const getPronunciationGuide = (bopomofo, pinyin, uiLang) => {
                const zh = (uiLang !== 'en');
                const tips = [];
                const b = (bopomofo || '').replace(/\s+/g, '');
                const p = (pinyin || '').toLowerCase();

                // ── Initials ────────────────────────────────────────────
                if (b.includes('ㄓ') || b.includes('ㄔ') || b.includes('ㄕ') || b.includes('ㄖ')) {
                    tips.push(zh
                        ? { title: "捲舌音（ㄓㄔㄕㄖ / zh ch sh r）", text: "舌尖往上捲、靠近硬顎前方。不要咬緊牙關，留一點縫讓氣流摩擦。ㄓ/ㄕ不送氣；ㄔ送氣（手放嘴前感受氣流）；ㄖ需要聲帶振動（最柔和的一個）。" }

                        ? { title: "平舌音（ㄗㄘㄙ / z c s）", text: "舌尖靠近下齒背後，保持平坦（不往上捲）。和捲舌音的最大區別就是：舌尖位置一個在「下面」、一個在「上面」。ㄘ送氣，ㄗ不送氣。" }
                        : { title: "Flat Sibilants (z c s)", text: "Tongue tip stays near the lower front teeth — FLAT, never curled. The defining contrast with retroflexes: flat-front vs. curl-back. ㄘ is aspirated (puff); ㄗ is not. Otherwise they differ only in aspiration." }
                    );
                }

                    tips.push(zh
                        ? { title: "舌面音（ㄐㄑㄒ / j q x）", text: "舌尖放鬆往下（或輕貼下齒背），舌面（前部）抬高靠近硬顎，氣流從狹窄通道擠出。ㄐ不送氣，ㄑ送氣，ㄒ是純摩擦音（類似英文 sh，但舌位偏前）。" }
                        : { title: "Palatal Initials (j q x)", text: "Tip rests behind lower teeth. The tongue BODY arches toward the palate — contact is body-to-palate, not tip. ㄐ is unaspirated, ㄑ is aspirated, ㄒ is a pure fricative (like English 'sh' but further forward and with the tip down)." }
                    );

                    tips.push(zh
                        ? { title: "軟顎音（ㄍㄎㄏ / g k h）", text: "舌「根」（後部）往上靠向軟顎（口腔最後方）。ㄍ不送氣，ㄎ送氣。ㄏ是摩擦音，像「對著冷玻璃哈氣」，舌根靠近軟顎但不閉合。" }
                        : { title: "Velar Initials (g k h)", text: "The back of the tongue rises toward the soft palate. ㄍ is unaspirated, ㄎ is aspirated (strong puff). ㄏ is a fricative — like fogging a cold mirror — tongue root approaches soft palate without fully closing." }
                    );
                }
                if (b.includes('ㄅ') || b.includes('ㄆ') || b.includes('ㄇ') || b.includes('ㄈ')) {
                    tips.push(zh
                        ? { title: "唇音（ㄅㄆㄇ / b p m + ㄈ/f）", text: "ㄅ/ㄆ：兩片嘴唇閉合再突然張開。ㄅ不送氣、ㄆ送氣。ㄇ是雙唇鼻音，讓氣流走鼻腔、感受嘴唇振動。ㄈ是唇齒音：上齒輕咬下唇，氣流從縫摩擦出來（像英文 f）。" }
                        : { title: "Labial Initials (b p m f)", text: "ㄅ/ㄆ: close both lips then release suddenly. ㄅ is unaspirated, ㄆ has a strong puff. ㄇ is a bilabial nasal — hum through the nose with lips closed, feel the lip buzz. ㄈ is labiodental: upper teeth on inner lower lip, air squeezes through (like English 'f')." }
                    );

                        : { title: "ㄨ / u (high-back rounded)", text: "Round the lips forward into a tight circle (as if about to whistle). Tongue pulls back, root rises. Many learners don't round enough — be deliberate about pursing the lips, more tightly than English 'oo'." }

                        ? { title: "ㄩ / ü（前圓唇 — 最難！）", text: "先把舌頭定位在 ㄧ 的位置（高、靠前），嘴唇不動；再把嘴唇「撮」成 ㄨ 的圓形。舌頭一定留在前方，不能往後退！英文無此音——靠「舌前+唇圓」的雙重感覺記憶。" }
                        : { title: "ㄩ / ü (front-rounded — the hardest!)", text: "First position the tongue at ㄧ (high, forward). Then — keeping the tongue exactly there — round the lips to ㄨ position. The simultaneous tension of tongue-forward + lips-round IS ㄩ. English has nothing like it — use that dual sensation as your memory anchor." }

                // ── Finals with nasal codas ──────────────────────────────
                if (b.includes('ㄣ') || b.includes('ㄢ') || b.includes('ㄧㄣ') || b.includes('ㄧㄢ') || b.includes('ㄩㄣ') || b.includes('ㄩㄢ')) {
                    tips.push(zh
                        ? { title: "鼻韻尾 ㄣ/ㄢ（舌尖鼻音）", text: "收尾時舌尖往上觸碰齒齦（像英文 n）。常見錯誤：把鼻音完全省掉，讓聲音在母音就停了。要感受振動進入鼻腔，才算收到位。" }
                        : { title: "Nasal Coda ㄣ/ㄢ — alveolar [n]", text: "At the syllable end, the tongue TIP rises to touch the alveolar ridge (like English 'n'). Common error: letting the vowel fade without nasal closure. Feel the vibration enter the nose as the tip seals at the ridge." }
                    );
                }
                if (b.includes('ㄤ') || b.includes('ㄥ') || b.includes('ㄧㄥ') || b.includes('ㄨㄥ')) {
                    tips.push(zh
                        ? { title: "鼻韻尾 ㄤ/ㄥ（舌根鼻音）", text: "收尾時舌根往上、閉合軟顎（像英文 ng）。中文的 ㄥ 比英文的 ng 更「乾淨」，不要帶多餘的 [g] 尾。感受振動在鼻腔後部。" }
                        : { title: "Nasal Coda ㄤ/ㄥ — velar [ŋ]", text: "At the syllable end, the tongue ROOT rises to close against the soft palate (like English 'ng' in 'sing'). Keep it clean — don't add a trailing [g]. Feel the nasal buzz at the BACK of the nasal cavity." }
                    );
                }

                // ── Tones ───────────────────────────────────────────────

                    );

                if (b.includes('ˉ') || p.match(/[āēīōū]/)) {

                        : { title: "Tone 1 (ˉ) — High Level", text: "Hold the pitch at your highest comfortable level from start to finish — like sustaining a musical note. Don't let it drift down or up mid-syllable. Think of a flat rooftop at the top of your range." }

                        ? { title: "二聲（ˊ）高升調", text: "從中音穩定升到最高點，像問句尾的上揚。要一路升到頂，不能在中途就平掉或停下來。" }

                                                {z.labio     && <ellipse cx="52" cy="114" rx="12" ry="8" fill="rgba(251,146,60,0.42)" />}
                                                {/* Hard palate */}
                                                <path d="M 70 95 C 120 60 180 60 215 105" fill="none" stroke="#fbbf24" strokeWidth="9" strokeLinecap="round" opacity="0.9" />
                                                {/* Soft palate */}
                                                <path d="M 210 110 C 235 130 242 145 238 160" fill="none" stroke="#fde68a" strokeWidth="9" strokeLinecap="round" opacity="0.9" />
                                                {/* Alveolar ridge bump */}
                                                <path d="M 62 98 C 68 87 76 85 83 92" fill="none" stroke="#b45309" strokeWidth="4" strokeLinecap="round" opacity="0.65" />
                                                {/* Dynamic tongue (matrix: x'=2.36x+26, y'=y+108) */}
                                                <g transform="matrix(2.36,0,0,1,26,108)">
                                                    <path d={tp} fill="rgba(251,113,133,0.88)" stroke="#be123c" strokeWidth="0.5" />
                                                </g>
                                                {/* Dynamic airflow */}
                                                <g transform="matrix(2.36,0,0,1,26,108)">
                                                    <path d={ap} fill="none" stroke="rgba(37,99,235,0.9)" strokeWidth="0.7" strokeLinecap="round" strokeDasharray="3 2" />
                                                </g>
                                                {/* Lips */}
                                                <path d="M 38 125 C 32 123 30 116 34 110 C 40 102 50 104 56 112" fill="none" stroke="#fb923c" strokeWidth="7" strokeLinecap="round" />
                                                <path d="M 38 140 C 32 142 30 149 34 156 C 40 164 50 162 56 154" fill="none" stroke="#fb923c" strokeWidth="7" strokeLinecap="round" />
                                                {/* Vocal folds */}
                                                <circle cx="250" cy="190" r={z.vocal ? "21" : "14"} fill={z.vocal ? "rgba(147,51,234,0.38)" : "rgba(147,51,234,0.14)"} stroke="rgba(147,51,234,0.8)" strokeWidth="2" />
                                                {z.vocal && <text x="243" y="194" fontSize="12" fill="#6b21a8" fontWeight="900">♫</text>}
                                                {/* Labels */}
                                                <text x="219" y="108" fontSize="9" fill="#92400e" fontWeight="700">{t.hp}</text>
                                                <text x="242" y="163" fontSize="9" fill="#92400e" fontWeight="700">{t.sp}</text>
                                                <text x="87" y="219" fontSize="9" fill="#9f1239" fontWeight="700">{t.tg}</text>
                                                <text x="13" y="102" fontSize="9" fill="#9a3412" fontWeight="700">{t.lp}</text>
                                                <text x="237" y="219" fontSize="9" fill="#6b21a8" fontWeight="700">{t.vf}</text>
                                                <text x="62" y="76" fontSize="8" fill="#64748b">{t.tt}</text>
                                                {/* Active zone labels */}
                                                {z.alveolar  && <text x="38" y="80" fontSize="8" fill="#c2410c" fontWeight="800">{ZH?'齒齦':'ridge'}</text>}
                                                {z.palatal   && <text x="90" y="51" fontSize="8" fill="#c2410c" fontWeight="800">{ZH?'硬顎':'palatal'}</text>}
                                                {z.retroflex && <text x="148" y="46" fontSize="8" fill="#c2410c" fontWeight="800">{ZH?'捲舌':'retro.'}</text>}
                                                {z.velar     && <text x="215" y="106" fontSize="8" fill="#c2410c" fontWeight="800">{ZH?'軟顎':'velar'}</text>}
                                                {z.bilabial  && <text x="10" y="125" fontSize="8" fill="#c2410c" fontWeight="800">{ZH?'雙唇':'bilabial'}</text>}
                                            </svg>
                                        </div>
                                        {/* Key articulation points */}
                                        <div className="space-y-2">
                                            {pts.map((pt, i) => (
                                                <div key={i} className="bg-white border border-slate-100 rounded-xl px-3 py-2 text-sm font-bold text-slate-700 shadow-sm">{pt}</div>
                                            ))}
                                        </div>
                                        {/* Detailed hint */}
                                        <div className="bg-indigo-50 rounded-2xl p-4 border border-indigo-100">
                                            <p className="text-xs font-black text-indigo-500 mb-1">
                                                {ZH ? '📖 詳細發音指引' : '📖 Detailed Articulation Guide'}
                                            </p>
                                            <p className="text-slate-600 text-xs leading-relaxed" style={{whiteSpace:'pre-line'}}>{formatHintText(lang === 'en' ? currentData.tongueHint : toZH(currentData.tongueHint))}</p>
                                        </div>
                                    </div>
                                    <div className="p-4 shrink-0 border-t border-slate-100">
                                        <button onClick={() => setShowAnatomy(false)} className="w-full bg-slate-800 hover:bg-slate-700 text-white py-3 rounded-xl font-bold cursor-pointer transition-colors">
                                            {ZH ? '關閉' : 'Close'}
                                        </button>
                                    </div>
                                </div>
                            </div>
                        );
                    })()}

                    {/* ── Favorites Table Modal (filtered, favorites-only) ── */}
                    {showFavTable && (() => {
                        const favSorted = [...favorites].sort((a,b) => a-b);
                        return (
                            <div className="fixed inset-0 bg-slate-900/70 backdrop-blur-sm z-[60] flex items-center justify-center p-4"
                                onClick={e => e.target === e.currentTarget && setShowFavTable(false)}>
                                <div className="bg-white w-full max-w-lg rounded-[2rem] shadow-2xl overflow-hidden border flex flex-col" style={{maxHeight:'85vh'}}>
                                    <div className="bg-gradient-to-r from-rose-500 to-pink-600 p-5 text-white flex items-center justify-between shrink-0">
                                        <h3 className="text-base font-black">♥ {t.collectedLabel} ({favorites.size})</h3>
                                        <button onClick={() => setShowFavTable(false)} className="text-white/80 hover:text-white text-2xl leading-none cursor-pointer">×</button>
                                    </div>
                                    <div className="overflow-y-auto flex-1">
                                        <table className="w-full text-sm">
                                            <thead className="sticky top-0 bg-slate-50 border-b border-slate-200 z-10">
                                                <tr>
                                                    <th className="px-3 py-2 text-left text-xs font-black text-slate-400 w-10">#</th>
                                                    <th className="px-3 py-2 text-left text-xs font-black text-slate-400">{lang==='en'?'Word':'單詞'}</th>
                                                    <th className="px-3 py-2 text-left text-xs font-black text-slate-400">{lang==='en'?'Meaning':'意思'}</th>
                                                    <th className="px-3 py-2 w-12"></th>
                                                </tr>
                                            </thead>
                                            <tbody>
                                                {favSorted.map((idx, pos) => {
                                                    const card = vocabularyList[idx];
                                                    if (!card) return null;
                                                    return (
                                                        <tr key={idx}
                                                            className={`border-b border-slate-100 transition-all duration-150 cursor-pointer hover:bg-rose-50 hover:scale-[1.01] ${currentCardIndex===idx?'bg-orange-50':''}`}
                                                            onClick={() => { setCurrentCardIndex(idx); resetPractice(); setShowFavTable(false); setShowFavorites(false); }}>
                                                            <td className="px-3 py-2.5 text-xs text-slate-400 font-mono">{pos+1}</td>
                                                            <td className="px-3 py-2.5">
                                                                <span className="font-black text-slate-800 text-base mr-2">{card.word}</span>
                                                                <span className="text-xs text-slate-400 font-mono">{card.pinyin}</span>
                                                            </td>
                                                            <td className="px-3 py-2.5 text-slate-500 text-xs">{MEANINGS[card.word] || '—'}</td>
                                                            <td className="px-3 py-2.5 text-center">
                                                                {currentCardIndex===idx
                                                                    ? <span className="text-[10px] font-black text-rose-600 bg-rose-50 px-2 py-0.5 rounded-full">▶</span>
                                                                    : <span className="text-[10px] text-slate-300">{t.jumpBtn}</span>}
                                                            </td>
                                                        </tr>
                                                    );
                                                })}
                                            </tbody>
                                        </table>
                                    </div>
                                </div>
                            </div>
                        );
                    })()}

                    {/* ── Feedback Modal ── */}
                    {showFeedbackModal && (
                        <div className="fixed inset-0 bg-slate-900/70 backdrop-blur-sm z-50 flex items-center justify-center p-4" onClick={() => setShowFeedbackModal(false)}>
                            <div className="bg-white w-full max-w-lg rounded-[2rem] shadow-2xl overflow-hidden border flex flex-col" style={{maxHeight:'92vh'}} onClick={e => e.stopPropagation()}>
                                <div className="bg-gradient-to-r from-emerald-500 to-teal-600 p-4 text-white flex items-center justify-between shrink-0">
                                    <div className="flex items-center gap-3">
                                        <span className="text-3xl font-black">{currentData.word}</span>
                                        <div>
                                            <div className="text-sm font-bold">{MEANINGS[currentData.word] || ''}</div>
                                            <div className="text-xs opacity-80">{currentData.pinyin} · {currentData.bopomofo}</div>
                                        </div>
                                    </div>
                                    <button onClick={() => setShowFeedbackModal(false)} className="text-white/80 hover:text-white text-3xl leading-none cursor-pointer">×</button>
                                </div>
                                <div className="overflow-y-auto flex-1 p-4 space-y-4">
                                    {/* Chromatic pitch canvas */}
                                    {pitchPoints.length > 0 && (
                                        <div>
                                            <p className="text-[11px] font-black text-slate-400 flex items-center gap-2 mb-1">
                                                <Icons.AudioWaveform /> {t.pitchTrackTitle}
                                                <span className="text-emerald-500">— {t.refPitch}</span>
                                                <span className="text-amber-400">▌ {t.yourPitch}</span>
                                            </p>
                                            <canvas ref={pitchCanvasRef} width="500" height="200" className="w-full rounded-xl bg-gray-900"></canvas>
                                        </div>
                                    )}
                                    {/* Tone contour comparison */}
                                    <div className="bg-slate-50 rounded-2xl p-4 border">
                                        <h4 className="text-xs font-black text-slate-500 mb-2 flex items-center gap-2">
                                            <Icons.AudioWaveform /> {t.pitchTitle}
                                            <span className="text-indigo-500">— {lang==='en'?'Standard':'標準'}</span>
                                            <span className="text-rose-400">- - {lang==='en'?'Typical error':'常見問題'}</span>
                                        </h4>
                                        <div className="h-20 w-full bg-white border-l border-b border-slate-200">
                                            <svg viewBox="0 0 120 100" className="w-full h-full overflow-visible">
                                                <path d={currentData.standardCurve} fill="transparent" stroke="#6366f1" strokeWidth="3" strokeLinecap="round" />
                                                <path d={currentData.userCurve} fill="transparent" stroke="#f43f5e" strokeWidth="3" strokeDasharray="5 3" strokeLinecap="round" />
                                            </svg>
                                        </div>
                                    </div>
                                    {/* Text feedback */}
                                    <div className="bg-amber-50 border border-amber-100 rounded-2xl p-4">
                                        <h5 className="text-xs font-black text-amber-600 mb-2">{t.fbLabel}</h5>
                                        <p className="text-slate-700 font-bold text-sm leading-relaxed">{lang === 'en' ? aiFeedback : toZH(aiFeedback)}</p>
                                    </div>
                                </div>
                                <div className="p-4 shrink-0 border-t border-slate-100 flex gap-3">
                                    <button onClick={() => { setShowFeedbackModal(false); handleRecordClick(); }} className="flex-1 bg-rose-500 hover:bg-rose-600 text-white py-3 rounded-xl text-sm font-bold cursor-pointer">
                                        {lang === 'en' ? '🎙 Record Again' : '🎙 再錄一次'}
                                    </button>
                                    <button onClick={() => setShowFeedbackModal(false)} className="flex-1 border-2 border-slate-200 text-slate-600 hover:bg-slate-50 py-3 rounded-xl text-sm font-bold cursor-pointer">
                                        {lang==='en'?'Close':'關閉'}
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* ── Card Table Modal ── */}
                    {showCardTable && (
                        <div className="fixed inset-0 bg-slate-900/70 backdrop-blur-sm z-50 flex items-center justify-center p-4"
                            onClick={e => e.target === e.currentTarget && setShowCardTable(false)}>
                            <div className="bg-white w-full max-w-lg rounded-[2rem] shadow-2xl overflow-hidden border flex flex-col" style={{maxHeight:'85vh'}}>
                                <div className="bg-gradient-to-r from-indigo-600 to-purple-600 p-5 text-white flex items-center justify-between shrink-0">
                                    <h3 className="text-base font-black">📋 {t.tableTitle} ({totalCards})</h3>
                                    <button onClick={() => setShowCardTable(false)} className="text-white/80 hover:text-white text-2xl leading-none cursor-pointer">×</button>
                                </div>
                                <div className="overflow-y-auto flex-1">
                                    <table className="w-full text-sm">
                                        <thead className="sticky top-0 bg-slate-50 border-b border-slate-200 z-10">
                                            <tr>
                                                <th className="px-3 py-2 text-left text-xs font-black text-slate-400 w-10">#</th>
                                                <th className="px-3 py-2 text-left text-xs font-black text-slate-400">Word</th>
                                                <th className="px-3 py-2 text-left text-xs font-black text-slate-400">Meaning</th>
                                                <th className="px-3 py-2 w-12"></th>
                                            </tr>
                                        </thead>
                                        <tbody>
                                            {vocabularyList.map((card, idx) => (
                                                <tr key={idx}
                                                    className={`border-b border-slate-100 transition-all duration-150 cursor-pointer hover:bg-indigo-50 hover:scale-[1.01] ${currentCardIndex===idx ? 'bg-orange-50' : ''}`}
                                                    onClick={() => { setCurrentCardIndex(idx); resetPractice(); setShowCardTable(false); }}>
                                                    <td className="px-3 py-2.5 text-xs text-slate-400 font-mono">{idx+1}</td>
                                                    <td className="px-3 py-2.5">
                                                        <span className="font-black text-slate-800 text-base mr-2">{card.word}</span>
                                                        <span className="text-xs text-slate-400 font-mono">{card.pinyin}</span>
                                                    </td>
                                                    <td className="px-3 py-2.5 text-slate-500 text-xs">{MEANINGS[card.word] || '—'}</td>
                                                    <td className="px-3 py-2.5 text-center">
                                                        {currentCardIndex === idx
                                                            ? <span className="text-[10px] font-black text-indigo-600 bg-indigo-50 px-2 py-0.5 rounded-full">▶</span>
                                                            : <span className="text-[10px] text-slate-300">{t.jumpBtn}</span>}
                                                    </td>
                                                </tr>
                                            ))}
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* ── Favorites Modal ── */}
                    {showFavorites && (
                        <div className="fixed inset-0 bg-slate-900/70 backdrop-blur-sm z-50 flex items-center justify-center p-4"
                            onClick={e => e.target === e.currentTarget && setShowFavorites(false)}>
                            <div className="bg-white w-full max-w-lg rounded-[2rem] shadow-2xl overflow-hidden border flex flex-col" style={{maxHeight:'85vh'}}>
                                <div className="bg-gradient-to-r from-rose-500 to-pink-600 p-4 text-white flex items-center justify-between shrink-0">
                                    <h3 className="text-base font-black">♥ {t.collectedLabel} ({favorites.size})</h3>
                                    <div className="flex gap-2 items-center">
                                        {favorites.size > 0
                                            ? <button onClick={() => setShowFavTable(true)} className="text-xs font-black bg-white/20 hover:bg-white/30 px-2 py-1 rounded-lg cursor-pointer">
                                                📋 {favPositionInSet >= 0 ? `${favPositionInSet + 1} / ${favorites.size}` : `— / ${favorites.size}`}
                                              </button>
                                            : <span className="text-xs font-black bg-white/10 opacity-50 px-2 py-1 rounded-lg cursor-not-allowed">📋 0 / 0</span>
                                        }
                                        <button onClick={() => setShowFavorites(false)} className="text-white/80 hover:text-white text-2xl leading-none cursor-pointer ml-1">×</button>
                                    </div>
                                </div>
                                <div className="overflow-y-auto flex-1 p-4">
                                    {favorites.size === 0
                                        ? <p className="text-slate-400 text-center py-16 font-bold">{t.favEmpty}</p>
                                        : <div className="grid grid-cols-2 gap-3">
                                            {[...favorites].sort((a,b) => a-b).map(idx => {
                                                const card = vocabularyList[idx];
                                                if (!card) return null;
                                                return (
                                                    <div key={idx}
                                                        className="bg-orange-50 border border-orange-100 rounded-2xl p-4 flex flex-col items-center gap-1 relative cursor-pointer hover:scale-[1.04] transition-transform shadow-sm"
                                                        onClick={() => { setCurrentCardIndex(idx); resetPractice(); setShowFavorites(false); }}>
                                                        <button onClick={e => { e.stopPropagation(); toggleFavorite(idx); }}
                                                            className="absolute top-2 right-2 text-rose-400 hover:text-rose-600 text-lg cursor-pointer leading-none">♥</button>
                                                        <span className="text-4xl font-black text-slate-800">{card.word}</span>
                                                        <span className="text-xs text-slate-500 font-semibold">{MEANINGS[card.word] || '—'}</span>
                                                        <span className="text-xs text-indigo-500 font-mono">{card.pinyin}</span>
                                                        <span className="text-[10px] text-slate-400 font-bold">#{idx+1}</span>
                                                    </div>
                                                );
                                            })}
                                        </div>
                                    }
                                </div>
                            </div>
                        </div>
                    )}

                    {/* 原本的新增卡片 Modal (保持不變) */}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
