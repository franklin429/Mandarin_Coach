            AudioWaveform: () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className="w-4 h-4 text-slate-400"><path d="M2 10v4"/><path d="M6 6v12"/><path d="M10 3v18"/><path d="M14 8v8"/><path d="M18 5v14"/><path d="M22 10v4"/></svg>,
            RefreshCw: () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className="w-3.5 h-3.5"><path d="M21 12a9 9 0 0 0-9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/><path d="M3 12a9 9 0 0 0 9 9 9.75 9.75 0 0 0 6.74-2.74L21 16"/><path d="M16 16h5v5"/></svg>,
            Sparkles: () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className="w-5 h-5 text-amber-300"><path d="m12 3-1.912 5.813a2 2 0 0 1-1.275 1.275L3 12l5.813 1.912a2 2 0 0 1 1.275 1.275L12 21l1.912-5.813a2 2 0 0 1 1.275-1.275L21 12l-5.813-1.912a2 2 0 0 1-1.275-1.275Z"/></svg>,
            X: () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className="w-6 h-6"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>,
            Settings: () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className="w-5 h-5"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg>
        };

        const App = () => {
            // 從瀏覽器本地儲存讀取 API Key，確保重整後不會消失
            const [apiKey, setApiKey] = React.useState(localStorage.getItem('gemini_api_key') || '');
            const [showApiSettings, setShowApiSettings] = React.useState(false);
            const [tempApiKey, setTempApiKey] = React.useState('');

            const [currentCardIndex, setCurrentCardIndex] = React.useState(0);
            const [recordingState, setRecordingState] = React.useState('idle');
            const [isPlayingStandard, setIsPlayingStandard] = React.useState(false);
            const [aiFeedback, setAiFeedback] = React.useState('');
            const [showResult, setShowResult] = React.useState(false);
            const [frameIndex, setFrameIndex] = React.useState(0);

            const [showManager, setShowManager] = React.useState(false);
            const [newWord, setNewWord] = React.useState('');
            const [newPinyin, setNewPinyin] = React.useState('');
            const [newBopomofo, setNewBopomofo] = React.useState('');
            const [newTag, setNewTag] = React.useState('General');
            const [newTongueHint, setNewTongueHint] = React.useState('');
            const [newTongueType, setNewTongueType] = React.useState('flat');
            const [showPronunciationGuide, setShowPronunciationGuide] = React.useState(true);
            const [lang, setLang] = React.useState('en');
            const [showAnatomy, setShowAnatomy] = React.useState(false);

            const T = {
                en: {
                    title:'Mandarin Coach', ver:'SPA v3.1', sub:n=>`${n} Flashcards · Oral Diagrams · AI Feedback`,
                    addCard:'+ Add Card', progress:'Progress', prev:'Prev', next:'Next',
                    listen:'Listen to Audio', tractLabel:'Vocal Tract (Facing Left)',
                    airLegend:'Airflow', tongueLegend:'Tongue',
                    waveReady:'Waveform Ready', recMsg:'Recording… tap to stop & analyze', idleMsg:'Tap to start recording',
                    pitchTitle:'Pitch Contour Comparison', fbLabel:'AI Feedback & Advice:',
                    again:'Practice Again', modalTitle:'Create Custom Flashcard',
                    wLabel:'Chinese Word *', wPH:'e.g., 熱', piLabel:'Pinyin *', piPH:'e.g., rè',
                    bpLabel:'Bopomofo *', bpPH:'e.g., ㄖㄜˋ', tpLabel:'Tongue Position',
                    flat:'Flat Tongue (e.g., ā)', retro:'Retroflex (e.g., chī)', hf:'High-Front (e.g., xiè)',
                    cancel:'Cancel', create:'Create Card',
                    guideTitle:'Pronunciation Guide', guideSub:'Tap to expand: mouth shape, tongue & tips',
                    expand:'Expand', collapse:'Collapse',
                    diagTitle:'Oral Cavity Diagram (Side View)', diagSub:'Reference: tongue tip/body, hard/soft palate, vocal folds',
                    toggle:'中文介面', settings:'API Config',
                    hp:'Hard Palate', sp:'Soft Palate', tg:'Tongue (body/tip)', tt:'Tip', lp:'Lips', vf:'Vocal Folds', af:'Airflow →',
                },
                zh: {
                    title:'中文發音教練', ver:'v3.1', sub:n=>`${n} 張學習卡・口腔圖解・AI錄音回饋`,
                    addCard:'＋ 新增卡片', progress:'進度', prev:'上一張', next:'下一張',
                    listen:'聽標準音', tractLabel:'口腔截面圖（左側視角）',
                    airLegend:'氣流', tongueLegend:'舌頭',
                    waveReady:'波形就緒', recMsg:'錄音中⋯點擊停止並分析', idleMsg:'點擊開始錄音',
                    pitchTitle:'聲調輪廓對比', fbLabel:'Gemini AI 語音回饋：',
                    again:'再次練習', modalTitle:'新增自訂學習卡',
                    wLabel:'單詞（漢字）*', wPH:'例：熱', piLabel:'拼音 *', piPH:'例：rè',
                    bpLabel:'注音 *', bpPH:'例：ㄖㄜˋ', tpLabel:'舌位預設類型',
                    flat:'平舌（例：ā）', retro:'捲舌（例：chī）', hf:'高前舌（例：xiè）',
                    cancel:'取消', create:'建立卡片',
                    guideTitle:'注音 / 拼音發聲教學', guideSub:'點開查看重點口型、舌位與練習法',
                    expand:'展開', collapse:'收合',
                    diagTitle:'口腔發聲教學圖（側面）', diagSub:'對照舌尖/舌面/硬顎/軟顎與喉頭位置',
                    toggle:'English UI', settings:'API 設定',
                    hp:'硬顎', sp:'軟顎', tg:'舌（舌面/舌尖）', tt:'舌尖', lp:'嘴唇', vf:'聲帶', af:'氣流方向',
                }
            };
            const t = T[lang];

            const canvasRef = React.useRef(null);
            const audioContextRef = React.useRef(null);
            const analyserRef = React.useRef(null);
            const streamRef = React.useRef(null);
            const animationRef = React.useRef(null);
            const mediaRecorderRef = React.useRef(null);
            const audioChunksRef = React.useRef([]);

            const [vocabularyList, setVocabularyList] = React.useState([
                {
                    word: '吃',
                    pinyin: 'chī',
                    bopomofo: 'ㄔ',
                    tag: 'Retroflex (捲舌音)',
                    tongueHint: '[Retroflex 捲舌音 ㄔ/chī] Face left. Curl your tongue tip up and backward towards the hard palate (yellow zone). Leave a narrow gap for the airflow to squeeze through. Keep your vocal cords relaxed (no vibration). Focus on the friction at the roof of your mouth.',
                    tonguePath: ["M 80 85 Q 55 75 42 60 Q 35 48 38 42 Q 44 40 50 52 Q 65 75 80 85 Z"],
                    airflowPath: ["M 80 55 Q 60 52 45 42 Q 35 38 10 42"],
                    throatActive: false,
                    standardCurve: "M 10 20 L 110 20",
                    userCurve: "M 10 32 L 110 32"
                },
                {
                    word: '你好',
                    pinyin: 'nǐ hǎo',
                    bopomofo: 'ㄋㄧˇ ㄏㄠˇ',
                    tag: 'Tone Sandhi (變調)',
                    tongueHint: '[Tone Sandhi 三聲變調 ㄋㄧˇ ㄏㄠˇ] Dynamic GIF: Notice the rapid tongue movement. It starts at the alveolar ridge for [n], flattens out for the high vowel [i], pulls back towards the soft palate for [h], and drops completely for the low vowel [ao]. Remember: "nǐ" shifts to a rising 2nd tone!',
                    tonguePath: [
                        "M 80 85 Q 60 70 45 55 Q 30 40 32 36 Q 37 36 45 48 Q 60 68 80 85 Z",
                        "M 80 85 Q 60 65 40 58 Q 25 55 25 60 Q 35 68 48 70 Q 65 75 80 85 Z",
                        "M 80 70 Q 60 45 35 65 Q 32 68 40 70 Q 60 80 80 85 Z",
                        "M 80 85 Q 50 75 28 65 Q 25 70 30 75 Q 50 85 80 85 Z"
                    ],
                    airflowPath: [
                        "M 80 50 Q 50 50 15 50",
                        "M 80 50 Q 50 45 10 50",
                        "M 80 40 Q 60 40 10 50",
                        "M 80 55 Q 50 55 10 55"
                    ],
                    throatActive: true,
                    standardCurve: "M 10 60 Q 35 30 55 20 M 65 40 Q 85 80 115 30",
                    userCurve: "M 10 65 Q 35 35 55 25 M 65 50 Q 85 65 115 45"
                },
                {
                    word: '這',
                    pinyin: 'zhè',
                    bopomofo: 'ㄓㄜˋ',
                    tag: 'Retroflex + Mid-Central Vowel (捲舌+央元音)',
                    tongueHint: '[捲舌+央元音 ㄓㄜˋ] Animated 2-step: (1) ㄓ — curl tongue tip up-back toward hard palate, NO aspiration (quieter than ㄔ). (2) ㄜ — tongue gently drops to a relaxed mid-central position: mid-height, slightly retracted, lips lightly open. 4th tone: sharp fall. Practice the contrast: 這/zhè (4th) vs 者/zhě (3rd) — same initial, different tone shape.',
                    tonguePath: [
                        "M 80 85 Q 55 74 42 58 Q 34 46 37 40 Q 44 38 50 50 Q 65 74 80 85 Z",
                        "M 80 85 Q 58 76 38 70 Q 27 66 29 62 Q 40 65 55 70 Q 70 80 80 85 Z"
                    ],
                    airflowPath: [
                        "M 80 52 Q 58 48 42 40 Q 32 36 10 40",
                        "M 80 55 Q 50 54 10 55"
                    ],
                    throatActive: false,
                    standardCurve: "M 10 8 L 110 75",
                    userCurve: "M 10 14 L 110 68"
                }
            ]);

            const currentData = vocabularyList[currentCardIndex] || vocabularyList[0];
            const totalCards = vocabularyList.length;

            React.useEffect(() => {
                let interval;
                const pathArray = currentData.tonguePath;
                if (Array.isArray(pathArray) && pathArray.length > 1) {
                    interval = setInterval(() => setFrameIndex(prev => (prev + 1) % pathArray.length), 700);
                } else {
                    setFrameIndex(0);
                }
                return () => clearInterval(interval);
            }, [currentCardIndex, currentData]);

            const stopMediaTracks = () => {
                if (streamRef.current) streamRef.current.getTracks().forEach(track => track.stop());
                if (audioContextRef.current && audioContextRef.current.state !== 'closed') audioContextRef.current.close();
                if (animationRef.current) cancelAnimationFrame(animationRef.current);
            };

            const startRecording = async () => {
                setRecordingState('recording');
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    streamRef.current = stream;
                    
                    const audioContext = new (window.AudioContext || window.webkitAudioContext)();
                    audioContextRef.current = audioContext;
                    const analyser = audioContext.createAnalyser();
                    analyserRef.current = analyser;
                    analyser.fftSize = 64;
                    const source = audioContext.createMediaStreamSource(stream);
                    source.connect(analyser);
                    drawVisualizer();

                    // 啟用真實的錄音擷取 (Blob)
                    audioChunksRef.current = [];
                    const mediaRecorder = new MediaRecorder(stream);
                    mediaRecorderRef.current = mediaRecorder;
                    
                    mediaRecorder.ondataavailable = (e) => {
                        if (e.data.size > 0) audioChunksRef.current.push(e.data);
                    };
                    
                    mediaRecorder.start();
                } catch (err) {
                    alert("麥克風存取失敗 / Microphone access denied.");
                    setRecordingState('error');
                }
            };

            const drawVisualizer = () => {
                if (!canvasRef.current || !analyserRef.current) return;
                const canvas = canvasRef.current;
                const ctx = canvas.getContext('2d');
                const bufferLength = analyserRef.current.frequencyBinCount;
                const dataArray = new Uint8Array(bufferLength);

                const draw = () => {
                    animationRef.current = requestAnimationFrame(draw);
                    analyserRef.current.getByteFrequencyData(dataArray);
                    ctx.clearRect(0, 0, canvas.width, canvas.height);
                    const barWidth = (canvas.width / bufferLength) * 1.5;
                    let x = 0;
                    for (let i = 0; i < bufferLength; i++) {
                        const barHeight = dataArray[i] / 2.2;
                        ctx.fillStyle = '#fb7185';
                        ctx.beginPath();
                        ctx.roundRect(x, canvas.height / 2 - barHeight / 2, barWidth - 4, Math.max(6, barHeight), 4);
                        ctx.fill();
                        x += barWidth;
                    }
                };
                draw();
            };

            const stopRecordingAndAnalyze = () => {
                setRecordingState('analyzing');
                if (mediaRecorderRef.current && mediaRecorderRef.current.state === "recording") {
                    mediaRecorderRef.current.stop();
                    mediaRecorderRef.current.onstop = () => {
                        stopMediaTracks();
                        
                        // 將音訊片段結合成一個 Blob
                        const audioBlob = new Blob(audioChunksRef.current, { type: mediaRecorderRef.current.mimeType });
                        
                        // 將 Blob 轉成 Base64 準備傳給 Gemini API
                        const reader = new FileReader();
                        reader.readAsDataURL(audioBlob);
                        reader.onloadend = async () => {
                            const base64Audio = reader.result.split(',')[1];
                            await callGeminiAPI(currentData, base64Audio, audioBlob.type);
                        };
                    };
                }
            };

            const handleRecordClick = () => {
                if (!apiKey && recordingState !== 'recording') {
                    alert("請先點擊右上角設定您的 Gemini API Key！\nPlease configure your Gemini API Key first.");
                    setShowApiSettings(true);
                    return;
                }
                if (recordingState === 'idle' || recordingState === 'completed' || recordingState === 'error') {
                    startRecording();
                    setShowResult(false);
                } else if (recordingState === 'recording') {
                    stopRecordingAndAnalyze();
                }
            };

            // 串接 Gemini 1.5 Flash API 進行音訊分析
            const callGeminiAPI = async (cardData, base64Audio, mimeType) => {
                setAiFeedback("AI 正在仔細聆聽並分析你的發音...");
                setShowResult(true);

                const prompt = `你現在是一個嚴格但鼓勵人的華語發音教練。使用者正在練習單字「${cardData.word}」（拼音：${cardData.pinyin}，注音：${cardData.bopomofo}）。
請直接「聆聽」附上的這段錄音，並評估他們的發音（包含聲母、韻母、聲調是否正確）。
請直接給出以下格式的回覆：
1. 綜合評分：(給一個 0 到 100 的數字)
2. 具體建議：(用一到兩句話具體說明問題，例如「你的捲舌音摩擦不夠」或「三聲沒有降到底」。如果念得很標準，請給予具體稱讚。)
請全程使用繁體中文。`;

                try {
                    const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            contents: [{
                                parts: [
                                    { text: prompt },
                                    { inline_data: { mime_type: mimeType || 'audio/webm', data: base64Audio } }
                                ]
                            }],
                            generationConfig: { maxOutputTokens: 250, temperature: 0.2 }
                        })
                    });

                    const data = await response.json();
                    if (data.error) {
                        throw new Error(data.error.message);
                    }
                    
                    const feedbackText = data.candidates[0].content.parts[0].text;
                    setAiFeedback(feedbackText);
                } catch (err) {
                    console.error(err);
                    setAiFeedback(`API 連線錯誤，請檢查您的 API Key 是否有效。錯誤訊息：${err.message}`);
                }
                setRecordingState('completed');
            };

            const playStandardAudio = () => {
                if ('speechSynthesis' in window) {
                    window.speechSynthesis.cancel();
                    setIsPlayingStandard(true);
                    const utterance = new SpeechSynthesisUtterance(currentData.word);
                    utterance.lang = 'zh-TW';
                    utterance.rate = 0.75;
                    utterance.onend = () => setIsPlayingStandard(false);
                    window.speechSynthesis.speak(utterance);
                }
            };

            const resetPractice = () => {
                stopMediaTracks(); setRecordingState('idle'); setShowResult(false);
                if (canvasRef.current) canvasRef.current.getContext('2d').clearRect(0, 0, canvasRef.current.width, canvasRef.current.height);
            };
            
            const saveApiKey = (e) => {
                e.preventDefault();
                setApiKey(tempApiKey);
                localStorage.setItem('gemini_api_key', tempApiKey);
                setShowApiSettings(false);
            };

            // [這裡保留了 getPronunciationGuide 與 handleAddCard 等輔助函式，為節省空間予以簡化]
            const getPronunciationGuide = (bopomofo, pinyin, uiLang) => {
                return { quick: [{label:"注音", value: bopomofo}, {label:"拼音", value: pinyin}], tips: [{title:"提示", text:"請多利用圖解與錄音回饋進行練習。"}] };
            };
            const handleAddCard = (e) => { e.preventDefault(); setShowManager(false); };

            return (
                <div className="p-4 md:p-8 flex flex-col items-center">
                    <div className="w-full max-w-4xl flex flex-col sm:flex-row items-center justify-between mb-8 gap-4">
                        <div className="flex items-center gap-3">
                            <div className="bg-gradient-to-br from-indigo-500 to-purple-600 p-2.5 rounded-2xl shadow-lg">
                                <Icons.BookOpen />
                            </div>
                            <div>
                                <h1 className="text-2xl md:text-3xl font-black tracking-wide flex items-center gap-2">
                                    {t.title} <span className="text-xs bg-indigo-100 text-indigo-700 px-2 py-0.5 rounded-md font-mono">{t.ver}</span>
                                </h1>
                                <p className="text-xs text-slate-400 font-bold">{t.sub(totalCards)}</p>
                            </div>
                        </div>
                        <div className="flex gap-3 items-center flex-wrap justify-center">
                            <button onClick={() => setLang(l => l === 'en' ? 'zh' : 'en')} className="flex items-center gap-2 bg-gradient-to-r from-amber-400 to-orange-500 hover:from-amber-500 hover:to-orange-600 text-white px-5 py-2.5 rounded-xl font-black text-sm shadow-lg transition-all hover:scale-105 cursor-pointer border-2 border-white/30">
                                🌐 {t.toggle}
                            </button>
                            
                            {/* 新增的 API Key 設定按鈕 */}
                            <button onClick={() => {setTempApiKey(apiKey); setShowApiSettings(true);}} className="flex items-center gap-2 bg-slate-700 hover:bg-slate-800 text-white px-4 py-2 rounded-xl font-bold text-sm shadow-md transition-all hover:scale-105 cursor-pointer">
                                <Icons.Settings /> {t.settings}
                            </button>

                            <button onClick={() => setShowAnatomy(true)} className="flex items-center gap-2 bg-emerald-500 hover:bg-emerald-600 text-white px-4 py-2 rounded-xl font-bold text-sm shadow-md transition-all hover:scale-105 cursor-pointer">
                                ℹ️ {lang === 'en' ? 'Anatomy Ref' : '解剖圖'}
                            </button>
                            <button onClick={() => setShowManager(!showManager)} className="flex items-center gap-2 bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-2 rounded-xl font-bold text-sm shadow-md transition-all hover:scale-105 cursor-pointer">
                                <Icons.Plus /> {t.addCard}
                            </button>
                        </div>
                    </div>

                    <div className="w-full max-w-4xl bg-white rounded-[2.5rem] shadow-2xl overflow-hidden border border-slate-100">
                        <div className="bg-slate-50/60 border-b border-slate-100 p-4 flex justify-between items-center">
                            <button onClick={() => { setCurrentCardIndex(p => p - 1); resetPractice(); }} disabled={currentCardIndex === 0} className={`flex items-center gap-1 px-4 py-2.5 rounded-xl font-bold ${currentCardIndex === 0 ? 'text-slate-300' : 'text-slate-600 hover:bg-slate-100 cursor-pointer'}`}>
                                <Icons.ChevronLeft /> {t.prev}
                            </button>
                            <span className="text-xs font-black text-indigo-600 bg-indigo-50 px-4 py-2 rounded-full border border-indigo-100 uppercase tracking-widest">{currentData.tag}</span>
                            <button onClick={() => { setCurrentCardIndex(p => p + 1); resetPractice(); }} disabled={currentCardIndex === totalCards - 1} className={`flex items-center gap-1 px-4 py-2.5 rounded-xl font-bold ${currentCardIndex === totalCards - 1 ? 'text-slate-300' : 'text-slate-600 hover:bg-slate-100 cursor-pointer'}`}>
                                {t.next} <Icons.ChevronRight />
                            </button>
                        </div>

                        <div className="p-6 md:p-10 space-y-8">
                            <div className="grid lg:grid-cols-2 gap-8">
                                <div className="bg-gradient-to-b from-orange-50/70 to-amber-50/20 p-8 rounded-[2rem] border border-orange-100/40 flex flex-col items-center justify-center text-center space-y-6 relative overflow-hidden shadow-inner">
                                    <h3 className="text-7xl lg:text-8xl font-black text-slate-800 drop-shadow-md">{currentData.word}</h3>
                                    <div className="flex flex-col gap-1 items-center">
                                        <p className="text-xl text-indigo-600 font-bold font-mono bg-indigo-50 px-4 py-0.5 rounded-lg border border-indigo-100">{currentData.bopomofo}</p>
                                        <p className="text-lg text-slate-500 font-mono bg-white/80 px-4 py-0.5 rounded-lg border border-slate-100">{currentData.pinyin}</p>
                                    </div>
                                    <button onClick={playStandardAudio} className="flex items-center gap-2 bg-gradient-to-r from-orange-500 to-amber-500 hover:from-orange-600 hover:to-amber-600 text-white px-8 py-4 rounded-2xl font-bold shadow-lg cursor-pointer transition-all active:scale-95">
                                        <Icons.Play /> {t.listen}
                                    </button>
                                </div>

                                <div className="bg-slate-50/50 p-6 rounded-[2rem] border border-slate-200/60 flex flex-col items-center relative">
                                    <h3 className="font-bold text-slate-700 mb-4 flex items-center gap-2 self-start bg-white px-4 py-2 rounded-xl shadow-sm border border-slate-100">
                                        <Icons.Wind /> {t.tractLabel}
                                    </h3>
                                    <div className="w-full max-w-[280px] aspect-square relative flex items-center justify-center bg-white rounded-2xl border border-slate-100 shadow-inner overflow-hidden">
                                        <svg viewBox="0 0 100 100" className="w-full h-full drop-shadow-md">
                                            <defs>
                                                <linearGradient id="tongueGrad" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stopColor="#ff8a8a" /><stop offset="100%" stopColor="#dc2626" /></linearGradient>
                                                <linearGradient id="palateGrad" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stopColor="#fbbf24" /><stop offset="100%" stopColor="#fef08a" /></linearGradient>
                                                <radialGradient id="throatGlow" cx="50%" cy="50%" r="50%"><stop offset="0%" stopColor="rgba(147, 51, 234, 0.9)" /><stop offset="100%" stopColor="rgba(147, 51, 234, 0)" /></radialGradient>
                                            </defs>
                                            <path d="M 10 10 Q 50 10 80 30 L 90 90 L 20 90 Z" fill="#f0f9ff" opacity="0.6" />
                                            <path d="M 15 45 C 30 35 60 30 80 60" fill="none" stroke="url(#palateGrad)" strokeWidth="4" strokeLinecap="round"/>
                                            <path d="M 15 45 L 18 53 L 22 45 Z" fill="#ffffff" stroke="#cbd5e1" strokeWidth="1" />
                                            <path d="M 20 65 L 15 75 L 30 85 L 80 95 L 80 80 C 60 80 40 70 20 65 Z" fill="#fed7aa" stroke="#fdba74" strokeWidth="1" />
                                            <path d="M 20 65 L 23 57 L 27 65 Z" fill="#ffffff" stroke="#cbd5e1" strokeWidth="1" />
                                            {currentData.throatActive && <circle cx="80" cy="70" r="14" fill="url(#throatGlow)" className="animate-pulse" />}
                                            <path d={currentData.tonguePath[frameIndex] || currentData.tonguePath[0]} fill="url(#tongueGrad)" stroke="#b91c1c" strokeWidth="1" className="transition-all duration-500 ease-in-out" />
                                            <path d={currentData.airflowPath[frameIndex] || currentData.airflowPath[0]} fill="none" stroke="#2563eb" strokeWidth="3.5" strokeLinecap="round" strokeDasharray="4 6" className="animate-dash" />
                                        </svg>
                                    </div>
                                    <div className="mt-5 bg-white p-4 rounded-2xl border border-slate-100 w-full shadow-sm">
                                        <p className="text-xs text-slate-500 font-bold leading-relaxed">{currentData.tongueHint}</p>
                                    </div>
                                </div>
                            </div>

                            <div className="flex flex-col items-center justify-center py-6 border-t border-b border-slate-100 bg-slate-50/30 rounded-[2rem]">
                                <div className="h-20 w-full max-w-sm mb-6 flex items-center justify-center bg-slate-50 border border-slate-200/70 rounded-2xl overflow-hidden shadow-inner relative">
                                    {recordingState === 'idle' && <div className="absolute text-slate-400 font-bold text-xs flex items-center gap-1.5"><Icons.Sliders /> {t.waveReady}</div>}
                                    {recordingState === 'analyzing' && <div className="absolute text-indigo-500 font-bold text-xs flex items-center gap-1.5 animate-pulse">Processing Audio...</div>}
                                    <canvas ref={canvasRef} width="350" height="80" className="w-full h-full z-10"></canvas>
                                </div>
                                <button onClick={handleRecordClick} className={`w-20 h-20 rounded-full flex items-center justify-center shadow-xl border-4 border-white transition-all transform hover:scale-105 active:scale-95 cursor-pointer ${recordingState === 'recording' ? 'bg-slate-800 text-white shadow-rose-300' : 'bg-gradient-to-br from-rose-400 to-red-500 text-white'}`}>
                                    {recordingState === 'recording' ? <Icons.Square /> : <Icons.Mic />}
                                </button>
                                <p className="text-xs font-black text-slate-500 mt-3">{recordingState === 'recording' ? t.recMsg : (apiKey ? t.idleMsg : '請先設定 API Key 才能使用 AI 評分')}</p>
                            </div>

                            {showResult && (
                                <div className="bg-gradient-to-br from-emerald-50/70 to-teal-50/30 p-6 rounded-[2rem] border border-emerald-100 grid md:grid-cols-2 gap-6">
                                    <div className="bg-white p-4 rounded-2xl border shadow-sm">
                                        <h4 className="text-xs font-black text-slate-500 mb-3 flex items-center gap-1.5 border-b pb-2"><Icons.Sparkles /> {t.fbLabel}</h4>
                                        <div className="text-slate-700 font-bold text-sm leading-relaxed whitespace-pre-wrap">
                                            {aiFeedback}
                                        </div>
                                    </div>
                                    <div className="flex items-center justify-center">
                                        <button onClick={resetPractice} className="bg-slate-800 hover:bg-slate-700 text-white px-8 py-4 rounded-2xl text-sm font-bold cursor-pointer transition-colors shadow-lg active:scale-95">{t.again}</button>
                                    </div>
                                </div>
                            )}
                        </div>
                    </div>

                    {/* API 設定 Modal */}
                    {showApiSettings && (
                        <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-4" onClick={() => setShowApiSettings(false)}>
                            <div className="bg-white w-full max-w-md rounded-[2rem] shadow-2xl overflow-hidden border p-6" onClick={e => e.stopPropagation()}>
                                <div className="flex items-center justify-between mb-4 border-b border-slate-100 pb-4">
                                    <div className="text-lg font-black text-slate-700 flex items-center gap-2"><Icons.Settings /> 設定 Gemini API Key</div>
                                    <button onClick={() => setShowApiSettings(false)} className="bg-slate-100 hover:bg-slate-200 w-8 h-8 rounded-full flex items-center justify-center cursor-pointer transition-colors">
                                        <Icons.X />
                                    </button>
                                </div>
                                <form onSubmit={saveApiKey} className="space-y-4">
                                    <div className="text-xs font-bold text-slate-500 bg-amber-50 text-amber-700 p-3 rounded-xl border border-amber-200 leading-relaxed">
                                        ⚠️ 安全提醒：您的 API Key 僅會儲存在您當前的瀏覽器中 (Local Storage)，不會上傳至任何公開伺服器或寫入 GitHub 原始碼中，請安心使用。
                                    </div>
                                    <div>
                                        <input type="password" required placeholder="Paste your Gemini API Key here..." value={tempApiKey} onChange={(e) => setTempApiKey(e.target.value)} className="w-full px-4 py-3 border border-slate-300 rounded-xl text-sm font-mono shadow-inner focus:outline-none focus:border-indigo-500 focus:ring-2 focus:ring-indigo-200" />
                                    </div>
                                    <button type="submit" className="w-full bg-indigo-600 hover:bg-indigo-700 text-white py-3 rounded-xl text-sm font-bold cursor-pointer transition-colors shadow-md">
                                        儲存設定 (Save)
                                    </button>
                                </form>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
